name: AIDaily Morning Brief

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  send-aidaily:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coze AIDaily workflow
        env:
          COZE_PAT: ${{ secrets.COZE_PAT }}
          COZE_WORKFLOW_ID: ${{ secrets.COZE_WORKFLOW_ID }}
        run: |
          curl -X POST "https://api.coze.cn/v1/workflow/run" \
            -H "Authorization: Bearer $COZE_PAT" \
            -H "Content-Type: application/json" \
            -d "{\"workflow_id\":\"$COZE_WORKFLOW_ID\",\"parameters\":{}}"
